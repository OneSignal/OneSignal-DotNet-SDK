name: Run Checks
permissions:
  contents: read
on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install CSharpier
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .
